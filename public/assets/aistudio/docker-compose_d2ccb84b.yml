version: '3.8'

services:
  api:
    build: .
    container_name: simply_lemon_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simply_lemon
    depends_on:
      - db
    volumes:
      - .:/app  # Mapeia a pasta local para facilitar testes (podes remover em produção final)

  db:
    image: postgres:15-alpine
    container_name: simply_lemon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simply_lemon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: